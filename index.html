<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#6C5CE7;--pri-l:#a29bfe;--bg:#F5F3FF;--card:#fff;--txt:#2d3436;--sub:#636e72;--green:#00b894;--red:#d63031;--orange:#e17055;--blue:#0984e3;--radius:16px;--shadow:0 2px 12px rgba(108,92,231,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);max-width:430px;margin:0 auto;min-height:100vh;overflow-x:hidden}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 20px;border-radius:20px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-pri{background:var(--pri);color:#fff}
.btn-outline{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn-sm{padding:5px 14px;font-size:12px;border-radius:14px}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:var(--bg);color:var(--sub);border:none}
.chip{display:inline-block;padding:4px 12px;border-radius:12px;font-size:12px;background:var(--bg);color:var(--pri);font-weight:500;margin:3px 4px 3px 0;cursor:pointer;border:1px solid transparent;transition:all .2s}
.chip:hover,.chip.active{background:var(--pri);color:#fff}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom,8px);border-top:1px solid #eee;z-index:99}
.tab-item{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--sub);cursor:pointer;padding:2px 0;min-width:50px;transition:color .2s}
.tab-item.active{color:var(--pri)}
.tab-item svg{margin-bottom:2px}
.page{padding:16px 16px 80px;min-height:100vh}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 56px);padding-bottom:0}
.chat-msgs{flex:1;overflow-y:auto;padding:12px 16px 12px;display:flex;flex-direction:column;gap:10px}
.chat-input-bar{display:flex;gap:8px;padding:10px 16px env(safe-area-inset-bottom,12px);background:#fff;border-top:1px solid #eee}
.chat-input-bar input{flex:1;border:1.5px solid #e0e0e0;border-radius:20px;padding:10px 16px;font-size:14px;outline:none;transition:border .2s}
.chat-input-bar input:focus{border-color:var(--pri)}
.chat-input-bar button{width:40px;height:40px;border-radius:50%;border:none;background:var(--pri);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.msg-row{display:flex;gap:8px;max-width:88%}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;word-break:break-word}
.msg-row.ai .msg-avatar{background:var(--pri);color:#fff}
.msg-row.ai .msg-bubble{background:#fff;box-shadow:var(--shadow)}
.msg-row.user .msg-avatar{background:#dfe6e9}
.msg-row.user .msg-bubble{background:var(--pri);color:#fff}
.msg-card{background:#fff;border-radius:12px;padding:12px;margin-top:6px;box-shadow:var(--shadow);font-size:13px}
.progress-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin:6px 0}
.progress-fill{height:100%;border-radius:4px;transition:width .6s ease}
.quick-chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.onboarding{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.insight-card{background:linear-gradient(135deg,#6C5CE7 0%,#a29bfe 100%);color:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px}
.learn-card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:12px}
.learn-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.risk-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:20px 20px env(safe-area-inset-bottom,16px);max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;border:2px solid #eee;background:#fff;cursor:pointer;transition:all .2s;font-size:12px}
.cat-btn.sel{border-color:var(--pri);background:var(--bg)}
.cat-btn .cemoji{font-size:26px}
.wizard-step{font-size:12px;color:var(--sub);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.wizard-step .dot{width:8px;height:8px;border-radius:50%}
.wizard-step .dot.active{background:var(--pri)}
.wizard-step .dot.done{background:var(--green)}
.wizard-step .dot.todo{background:#ddd}
.confirm-card{background:var(--bg);border-radius:14px;padding:16px;margin:12px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.cal-hdr{font-size:11px;color:var(--sub);text-align:center;padding:4px 0;font-weight:600}
.cal-cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;position:relative;transition:all .2s}
.cal-cell.today{box-shadow:inset 0 0 0 2px var(--pri)}
.cal-cell .cal-day{font-weight:600;font-size:12px}
.cal-cell .cal-amt{font-size:9px;font-weight:700;margin-top:1px}
.anim-fade{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

const DonutChart=({data,size=120})=>{const total=data.reduce((s,d)=>s+d.value,0);let cum=0;const colors=["#6C5CE7","#00b894","#e17055","#0984e3","#fdcb6e","#d63031","#a29bfe","#55efc4"];return <div style={{display:"flex",alignItems:"center",gap:16}}><svg width={size} height={size} viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#eee" strokeWidth="6"/>{data.map((d,i)=>{const pct=total?d.value/total*100:0;const offset=100-cum+25;cum+=pct;return <circle key={i} cx="21" cy="21" r="15.9" fill="none" stroke={colors[i%colors.length]} strokeWidth="6" strokeDasharray={`${pct} ${100-pct}`} strokeDashoffset={offset} strokeLinecap="round"/>})}<text x="21" y="20" textAnchor="middle" fontSize="5" fill="#2d3436" fontWeight="700">{total.toFixed(0)}</text><text x="21" y="25" textAnchor="middle" fontSize="3" fill="#636e72">总计(元)</text></svg><div style={{display:"flex",flexDirection:"column",gap:4}}>{data.map((d,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,fontSize:12}}><span style={{width:10,height:10,borderRadius:3,background:colors[i%colors.length],flexShrink:0}}/><span style={{color:"#636e72"}}>{d.name}</span><span style={{fontWeight:600,marginLeft:4}}>{d.value.toFixed(0)}</span></div>)}</div></div>};

/* ===== AI CORE ===== */
const detectIntent=(text)=>{const t=text.toLowerCase();

if(/建议|怎么办|咋办|帮帮|不知道|迷茫|焦虑|压力|纠结/.test(t))return"advice";

let insights=[];if(todayExp>0)insights.push("今天已花费"+todayExp+"元");if(monthExp>0)insights.push("本月累计支出"+monthExp+"元");

const tip=DAILY_TIPS[Math.floor(Math.random()*DAILY_TIPS.length)];
return timeGreet+"！我是攒攒，你的AI理财搭子～ "+(insights.length>0?insights.join("；")+"。":tip)+"\n\n有什么理财问题都可以问我，也可以直接跟我说\"花了xx元买xxx\"来记账哦！"};

case"record":{const cat=matchCat(text);const amount=parseAmount(text);if(!amount)return{text:"我没看清金额呢，可以说具体点吗？比如\"花了15元午餐\""};const note=text.replace(/[记一下]*[账笔录]?/,"").replace(/花了|花掉|买了|吃了|充了|交了|付了|缴了/,"").replace(/\d+\.?\d*\s*(元|块|￥|¥)?/,"").trim()||CAT_NAMES[cat];return{text:"好的，已帮你记录！",card:"record",data:{type:"expense",amount,cat,note},postTip:getPostRecordTip(cat,amount)};}

case"goal":return{text:"攒钱目标是好习惯！你可以在「目标」页面设置。\n\n先想好：\n1. 想买什么/存多少？\n2. 计划多久攒够？\n\n我帮你算每天要攒多少钱～",card:"goal_tip"};

/* ===== 攒钱日历组件 SavingCalendar ===== */
const SavingCalendar=({goal})=>{
const logs=goal.saveLogs||[];
const[viewDate,setViewDate]=useState(()=>new Date());
const year=viewDate.getFullYear();const month=viewDate.getMonth();
const today=new Date();const todayStr=today.toISOString().slice(0,10);
const firstDay=new Date(year,month,1).getDay();
const daysInMonth=new Date(year,month+1,0).getDate();
const monthStr=year+"-"+(month+1<10?"0":"")+(month+1);
/* 按日聚合存钱记录 */
const dayMap={};logs.forEach(l=>{if(l.date.startsWith(monthStr)){const d=parseInt(l.date.slice(8,10));dayMap[d]=(dayMap[d]||0)+l.amount}});
const monthTotal=Object.values(dayMap).reduce((s,v)=>s+v,0);
/* 颜色梯度 */
const maxAmt=Math.max(...Object.values(dayMap),1);
const getColor=(amt)=>{const ratio=amt/maxAmt;if(ratio>0.7)return{bg:"#6C5CE7",fg:"#fff"};if(ratio>0.4)return{bg:"#a29bfe",fg:"#fff"};return{bg:"#ddd6fe",fg:"#6C5CE7"}};

const prevMonth=()=>{const d=new Date(year,month-1,1);setViewDate(d)};
const nextMonth=()=>{const d=new Date(year,month+1,1);setViewDate(d)};

const cells=[];
for(let i=0;i<firstDay;i++)cells.push(<div key={"e"+i}/>);
for(let d=1;d<=daysInMonth;d++){
const ds=monthStr+"-"+(d<10?"0":"")+d;
const isToday=ds===todayStr;
const amt=dayMap[d];
const col=amt?getColor(amt):{bg:"transparent",fg:"var(--txt)"};
cells.push(<div key={d} className={"cal-cell"+(isToday?" today":"")} style={{background:amt?col.bg:"transparent"}}>
<span className="cal-day" style={{color:amt?col.fg:"var(--txt)"}}>{d}</span>
{amt&&<span className="cal-amt" style={{color:col.fg}}>+{amt}</span>}
</div>);
}

return <div className="card" style={{padding:14}}>
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
<span onClick={prevMonth} style={{cursor:"pointer",padding:"4px 8px",fontSize:16,color:"var(--sub)"}}>‹</span>
<span style={{fontWeight:700,fontSize:14}}>{year}年{month+1}月</span>
<span onClick={nextMonth} style={{cursor:"pointer",padding:"4px 8px",fontSize:16,color:"var(--sub)"}}>›</span>
</div>
{monthTotal>0&&<div style={{textAlign:"center",fontSize:12,color:"var(--pri)",marginBottom:6}}>本月已攒 <b>¥{monthTotal}</b></div>}
<div className="cal-grid">
{["日","一","二","三","四","五","六"].map(h=><div key={h} className="cal-hdr">{h}</div>)}
{cells}
</div>
{/* 图例 */}
<div style={{display:"flex",gap:12,justifyContent:"center",marginTop:10,fontSize:11,color:"var(--sub)"}}>
<span style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:10,height:10,borderRadius:3,background:"#ddd6fe"}}/> 少量</span>
<span style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:10,height:10,borderRadius:3,background:"#a29bfe"}}/> 中等</span>
<span style={{display:"flex",alignItems:"center",gap:3}}><span style={{width:10,height:10,borderRadius:3,background:"#6C5CE7"}}/> 大额</span>
</div>
</div>};


/* ===== HOME PAGE ===== */
const HomePage=({records,goals,setTab,onOpenWizard})=>{const thisMonth=new Date().toISOString().slice(0,7);const monthRecs=records.filter(r=>r.date.startsWith(thisMonth));const income=monthRecs.filter(r=>r.type==="income").reduce((s,r)=>s+r.amount,0);const expense=monthRecs.filter(r=>r.type==="expense").reduce((s,r)=>s+r.amount,0);const balance=income-expense;
const catMap={};monthRecs.filter(r=>r.type==="expense").forEach(r=>{catMap[r.cat]=(catMap[r.cat]||0)+r.amount});const chartData=Object.entries(catMap).map(([k,v])=>({name:CAT_NAMES[k]||k,value:v})).sort((a,b)=>b.value-a.value);const topCat=chartData[0];
const last7=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);const dayExp=records.filter(r=>r.date===ds&&r.type==="expense").reduce((s,r)=>s+r.amount,0);last7.push({name:(d.getMonth()+1)+"/"+d.getDate(),value:dayExp})}
let insight="";if(expense===0)insight="本月还没有支出记录，开始记账吧！";else{insight="本月支出 ¥"+expense;if(topCat)insight+="，"+topCat.name+"占比最高("+(topCat.value/expense*100).toFixed(0)+"%)";if(income>0){const rate=(expense/income*100).toFixed(0);insight+="，收支比"+rate+"%";if(rate>80)insight+="，建议适当控制开支";else insight+="，支出控制不错";}insight+="。"}

return <div className="page anim-fade">
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
<div><span style={{fontSize:14,color:"var(--sub)"}}>本月总览</span><h2 style={{fontSize:22,marginTop:4}}>¥{balance.toFixed(0)} <span style={{fontSize:13,color:"var(--sub)",fontWeight:400}}>结余</span></h2></div>
<button className="btn btn-pri" onClick={onOpenWizard} style={{fontSize:15,padding:"10px 20px"}}>+ 记一笔</button>
</div>

<div className="card"><div style={{display:"flex",justifyContent:"space-around",textAlign:"center"}}><div onClick={()=>setTab("ledger")} style={{cursor:"pointer"}}><div style={{fontSize:12,color:"var(--sub)"}}>收入</div><div style={{fontSize:20,fontWeight:700,color:"var(--green)"}}>{income}</div></div><div onClick={()=>setTab("ledger")} style={{cursor:"pointer"}}><div style={{fontSize:12,color:"var(--sub)"}}>支出</div><div style={{fontSize:20,fontWeight:700,color:"var(--red)"}}>{expense}</div></div><div><div style={{fontSize:12,color:"var(--sub)"}}>攒钱目标</div><div style={{fontSize:20,fontWeight:700,color:"var(--pri)"}}>{goals.length}个</div></div></div></div>

<div className="insight-card"><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={{fontSize:18}}>🤖</span><span style={{fontWeight:700}}>AI 洞察</span></div><div style={{fontSize:13,lineHeight:1.8}}>{insight}</div><div onClick={()=>setTab("chat")} style={{marginTop:10,padding:"6px 14px",background:"rgba(255,255,255,0.2)",borderRadius:12,display:"inline-block",fontSize:12,cursor:"pointer"}}>💬 问攒攒更多建议</div></div>

{chartData.length>0&&<div className="card"><div style={{fontWeight:600,marginBottom:10,fontSize:14}}>本月消费分布</div><DonutChart data={chartData}/></div>}

<div className="card"><div style={{fontWeight:600,marginBottom:10,fontSize:14}}>近7日支出趋势</div><BarChart data={last7} height={90}/></div>

{goals.length>0&&<div className="card"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><span style={{fontWeight:600,fontSize:14}}>攒钱进度</span><span style={{fontSize:12,color:"var(--pri)",cursor:"pointer"}} onClick={()=>setTab("goal")}>查看全部</span></div>{goals.slice(0,2).map(g=><div key={g.id} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:13}}><span>{g.icon} {g.name}</span><span style={{color:"var(--pri)",fontWeight:600}}>{(g.saved/g.target*100).toFixed(0)}%</span></div><div className="progress-bar"><div className="progress-fill" style={{width:Math.min(g.saved/g.target*100,100)+"%",background:"var(--pri)"}}/></div></div>)}</div>}

<div style={{display:"flex",gap:10,marginTop:4}}><div className="card" style={{flex:1,textAlign:"center",cursor:"pointer",padding:14}} onClick={()=>setTab("chat")}><span style={{fontSize:24}}>💬</span><div style={{fontSize:12,marginTop:6,color:"var(--sub)"}}>AI对话记账</div></div><div className="card" style={{flex:1,textAlign:"center",cursor:"pointer",padding:14}} onClick={()=>setTab("learn")}><span style={{fontSize:24}}>📚</span><div style={{fontSize:12,marginTop:6,color:"var(--sub)"}}>理财学堂</div></div></div>
</div>};

/* ===== CHAT PAGE ===== */
const ChatPage=({records,setRecords,goals,onOpenWizard})=>{const[msgs,setMsgs]=useState([]);const[input,setInput]=useState("");const bottomRef=useRef(null);const inited=useRef(false);
useEffect(()=>{if(!inited.current){inited.current=true;const greeting=getProactiveGreeting(records,goals);setMsgs([{role:"ai",text:greeting}])}},[]);
useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"})},[msgs]);

const handleSend=()=>{const t=input.trim();if(!t)return;setInput("");const intent=detectIntent(t);const reply=genReply(t,intent,records,goals);const newMsgs=[...msgs,{role:"user",text:t},{role:"ai",text:reply.text,card:reply.card,cardData:reply.data,postTip:reply.postTip}];
if(reply.card==="record"&&reply.data){const nr={id:Date.now(),type:"expense",amount:reply.data.amount,cat:reply.data.cat,note:reply.data.note,date:new Date().toISOString().slice(0,10)};setRecords(prev=>[nr,...prev])}
if(reply.card==="income"&&reply.data){const nr={id:Date.now(),type:"income",amount:reply.data.amount,cat:"income",note:reply.data.note,date:new Date().toISOString().slice(0,10)};setRecords(prev=>[nr,...prev])}
setMsgs(newMsgs)};

const handleQuick=(q)=>{if(q==="记一笔"){onOpenWizard();return;}setInput(q);setTimeout(()=>{const intent=detectIntent(q);const reply=genReply(q,intent,records,goals);setMsgs(prev=>[...prev,{role:"user",text:q},{role:"ai",text:reply.text,card:reply.card,cardData:reply.data,postTip:reply.postTip}])},100)};

const handleRiskComplete=(level,score)=>{setMsgs(prev=>[...prev,{role:"ai",text:"评估完成！你的风险偏好类型是："+RISK_LEVELS[level],card:"risk_result",cardData:{level,score}}])};

const quickBtns=["记一笔","分析消费","怎么省钱","帮我规划","测风险类型"];

return <div className="chat-wrap"><div className="chat-msgs">{msgs.map((m,i)=><React.Fragment key={i}><div className={"msg-row "+m.role}><div className="msg-avatar">{m.role==="ai"?"🐷":"😊"}</div><div><div className="msg-bubble" style={{whiteSpace:"pre-wrap"}}>{m.text}</div>{m.card==="record"&&m.cardData&&<RecordCard data={m.cardData}/>}{m.card==="income"&&m.cardData&&<IncomeCard data={m.cardData}/>}{m.card==="balance"&&m.cardData&&<BalanceCard data={m.cardData}/>}{m.card==="analysis"&&m.cardData&&<AnalysisCard data={m.cardData}/>}{m.card==="goal_tip"&&<GoalTipCard/>}{m.card==="plan"&&<PlanCard records={records}/>}{m.card==="risk_assess"&&<RiskAssessCard onComplete={handleRiskComplete}/>}{m.card==="risk_result"&&m.cardData&&<RiskResultCard level={m.cardData.level} score={m.cardData.score}/>}{m.card==="risk_warning"&&<RiskWarningCard/>}{m.postTip&&<div style={{fontSize:12,color:"var(--pri)",marginTop:6,padding:"8px 12px",background:"#f5f3ff",borderRadius:10,lineHeight:1.6}}>💡 {m.postTip}</div>}</div></div></React.Fragment>)}
<div className="quick-chips" style={{padding:"8px 0"}}>{quickBtns.map(q=><span key={q} className="chip" onClick={()=>handleQuick(q)}>{q}</span>)}</div>
<div ref={bottomRef}/></div>
<div className="chat-input-bar"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSend()} placeholder="说说你的花销或理财问题..."/><button onClick={handleSend}><IC name="send" size={18} color="#fff"/></button></div></div>};


/* ===== LEDGER PAGE ===== */
const LedgerPage=({records})=>{const[filter,setFilter]=useState("all");const filtered=filter==="all"?records:records.filter(r=>r.type===filter);
return <div className="page anim-fade"><h2 style={{fontSize:18,marginBottom:12}}>账本明细</h2><div style={{display:"flex",gap:8,marginBottom:14}}>{[["all","全部"],["expense","支出"],["income","收入"]].map(([k,v])=><span key={k} className={"chip"+(filter===k?" active":"")} onClick={()=>setFilter(k)}>{v}</span>)}</div>{filtered.length===0?<div style={{textAlign:"center",color:"var(--sub)",padding:40}}>暂无记录～<br/>去跟攒攒对话记一笔吧</div>:filtered.map(r=><div key={r.id} className="card" style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:14}}><div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>{r.type==="income"?"💰":(CAT_EMOJI[r.cat]||"📦")}</span><div><div style={{fontWeight:600,fontSize:14}}>{r.note}</div><div style={{fontSize:11,color:"var(--sub)",marginTop:2}}>{r.date} · {r.type==="income"?"收入":CAT_NAMES[r.cat]||"其他"}</div></div></div><div style={{fontWeight:700,fontSize:16,color:r.type==="income"?"var(--green)":"var(--red)"}}>{r.type==="income"?"+":"-"}{r.amount}</div></div>)}</div>};

/* ===== GOAL PAGE (含攒钱日历) ===== */
const GoalPage=({goals,setGoals})=>{const[showAdd,setShowAdd]=useState(false);const[newName,setNewName]=useState("");const[newTarget,setNewTarget]=useState("");const emojis=["🎯","📱","✈️","🎮","💻","👟","📸","🎸","🏠","🎓"];const[selEmoji,setSelEmoji]=useState("🎯");const[expandCal,setExpandCal]=useState(null);
const[addAmtId,setAddAmtId]=useState(null);const[customAmt,setCustomAmt]=useState("");

const addGoal=()=>{if(!newName||!newTarget)return;setGoals(prev=>[...prev,{id:Date.now(),name:newName,target:parseFloat(newTarget),saved:0,icon:selEmoji,saveLogs:[]}]);setNewName("");setNewTarget("");setShowAdd(false)};
const addSaving=(id,amt)=>{const today=new Date().toISOString().slice(0,10);setGoals(prev=>prev.map(g=>{if(g.id!==id)return g;const newSaved=Math.min(g.saved+amt,g.target);const logs=[...(g.saveLogs||[])];const existing=logs.find(l=>l.date===today);if(existing)existing.amount+=amt;else logs.push({date:today,amount:amt});return{...g,saved:newSaved,saveLogs:logs}}))};

return <div className="page anim-fade"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><h2 style={{fontSize:18}}>攒钱目标</h2><button className="btn btn-pri btn-sm" onClick={()=>setShowAdd(!showAdd)}><IC name="plus" size={14} color="#fff"/> 新目标</button></div>

{showAdd&&<div className="card anim-fade"><div style={{marginBottom:10}}><div style={{fontSize:13,color:"var(--sub)",marginBottom:6}}>选个图标</div><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{emojis.map(e=><span key={e} onClick={()=>setSelEmoji(e)} style={{fontSize:22,cursor:"pointer",padding:4,borderRadius:8,background:selEmoji===e?"var(--bg)":"transparent"}}>{e}</span>)}</div></div><input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="目标名称，如：新手机" style={{width:"100%",padding:"8px 12px",borderRadius:10,border:"1.5px solid #e0e0e0",marginBottom:8,fontSize:14,outline:"none"}}/><input type="number" value={newTarget} onChange={e=>setNewTarget(e.target.value)} placeholder="目标金额（元）" style={{width:"100%",padding:"8px 12px",borderRadius:10,border:"1.5px solid #e0e0e0",marginBottom:10,fontSize:14,outline:"none"}}/><button className="btn btn-pri" style={{width:"100%"}} onClick={addGoal}>创建目标</button></div>}

{goals.map(g=>{const pct=Math.min(g.saved/g.target*100,100);const isCal=expandCal===g.id;return <div key={g.id} className="card">
<div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:28}}>{g.icon}</span><div><div style={{fontWeight:700}}>{g.name}</div><div style={{fontSize:12,color:"var(--sub)"}}>{g.saved}/{g.target}元</div></div></div><span style={{fontWeight:700,color:"var(--pri)",fontSize:16}}>{pct.toFixed(0)}%</span></div>
<div className="progress-bar"><div className="progress-fill" style={{width:pct+"%",background:pct>=100?"var(--green)":"var(--pri)"}}/></div>

{/* 存钱操作区 */}
<div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap",alignItems:"center"}}>
{[10,50,100].map(a=><button key={a} className="btn btn-outline btn-sm" onClick={()=>addSaving(g.id,a)}>+{a}元</button>)}
{addAmtId===g.id?<div style={{display:"flex",gap:4,alignItems:"center"}}><input type="number" value={customAmt} onChange={e=>setCustomAmt(e.target.value)} placeholder="自定义" style={{width:70,padding:"4px 8px",borderRadius:8,border:"1.5px solid #ddd",fontSize:12,outline:"none"}} autoFocus/><button className="btn btn-pri btn-sm" onClick={()=>{if(customAmt&&parseFloat(customAmt)>0){addSaving(g.id,parseFloat(customAmt));setCustomAmt("");setAddAmtId(null)}}}>存</button></div>:<button className="btn btn-outline btn-sm" onClick={()=>setAddAmtId(g.id)}>自定义</button>}
</div>

{/* 日历切换 */}
<div onClick={()=>setExpandCal(isCal?null:g.id)} style={{textAlign:"center",marginTop:10,fontSize:12,color:"var(--pri)",cursor:"pointer",padding:"4px 0"}}>{isCal?"收起日历 ▲":"查看攒钱日历 📅"}</div>
{isCal&&<SavingCalendar goal={g}/>}
</div>})}

{goals.length===0&&!showAdd&&<div style={{textAlign:"center",color:"var(--sub)",padding:40}}><div style={{fontSize:48,marginBottom:12}}>🎯</div><div>还没有攒钱目标</div><div style={{fontSize:13,marginTop:4}}>设定一个小目标，攒攒陪你一起实现！</div></div>}
</div>};

/* ===== LEARN PAGE ===== */
const LearnPage=({setTab})=>{const[selTopic,setSelTopic]=useState(null);const[riskResult,setRiskResult]=useState(null);const[showRiskTest,setShowRiskTest]=useState(false);
const tip=DAILY_TIPS[new Date().getDate()%DAILY_TIPS.length];
const handleRiskComplete=(level,score)=>{setRiskResult({level,score});setShowRiskTest(false)};

return <div className="page anim-fade"><h2 style={{fontSize:18,marginBottom:14}}>理财学堂</h2>

<div className="insight-card"><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}><span style={{fontSize:16}}>💡</span><span style={{fontWeight:600,fontSize:13}}>今日理财小贴士</span></div><div style={{fontSize:13,lineHeight:1.6}}>{tip}</div></div>

<div className="card" style={{cursor:"pointer"}} onClick={()=>setShowRiskTest(true)}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}><div style={{display:"flex",alignItems:"center",gap:10}}><div className="learn-icon" style={{background:"#fff5f5"}}>🧪</div><div><div style={{fontWeight:700,fontSize:14}}>风险偏好评估</div><div style={{fontSize:12,color:"var(--sub)",marginTop:2}}>{riskResult?"你是："+RISK_LEVELS[riskResult.level]:"3道题测出你的投资性格"}</div></div></div><span style={{color:"var(--pri)",fontSize:13}}>{riskResult?"重新测试":"开始 →"}</span></div></div>

{showRiskTest&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}><div style={{background:"#fff",borderRadius:20,padding:20,maxWidth:360,width:"100%",maxHeight:"80vh",overflow:"auto"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><span style={{fontWeight:700,fontSize:16}}>风险偏好评估</span><span onClick={()=>setShowRiskTest(false)} style={{cursor:"pointer",fontSize:18,color:"var(--sub)"}}>✕</span></div><RiskAssessCard onComplete={handleRiskComplete}/>{riskResult&&<div><RiskResultCard level={riskResult.level} score={riskResult.score}/><button className="btn btn-pri" style={{width:"100%",marginTop:8}} onClick={()=>setShowRiskTest(false)}>知道了</button></div>}</div></div>}

<div style={{fontWeight:600,fontSize:14,marginBottom:10,marginTop:4}}>理财知识库</div>
{LEARN_TOPICS.map(topic=><div key={topic.id} className="learn-card" onClick={()=>setSelTopic(selTopic===topic.id?null:topic.id)}><div className="learn-icon" style={{background:topic.color+"18"}}>{topic.icon}</div><div style={{flex:1}}><div style={{fontWeight:600,fontSize:14}}>{topic.title}</div><div style={{fontSize:12,color:"var(--sub)",marginTop:2}}>{topic.desc}</div>{selTopic===topic.id&&<div style={{marginTop:10,padding:12,background:"var(--bg)",borderRadius:10,fontSize:13,lineHeight:1.8,whiteSpace:"pre-wrap"}}>{topic.content}</div>}</div></div>)}

<div style={{textAlign:"center",marginTop:16,padding:16}}><div style={{fontSize:13,color:"var(--sub)",marginBottom:8}}>有更多理财问题？</div><button className="btn btn-pri" onClick={()=>setTab("chat")}>💬 问问攒攒</button></div>
</div>};


/* ===== ONBOARDING ===== */
const Onboarding=({onDone})=>{const[step,setStep]=useState(0);const steps=[{emoji:"🐷",title:"你好，我是攒攒！",desc:"你的AI理财搭子，帮你轻松记账、科学攒钱、学习理财知识。"},{emoji:"💬",title:"对话式记账",desc:"只需说\"花了15元午餐\"，AI自动识别金额和分类，记账从未如此简单。"},{emoji:"🎓",title:"理财学堂",desc:"风险评估、防骗指南、攒钱技巧…从零开始学理财，做自己的CFO！"}];const s=steps[step];

/* ===== APP ===== */
const App=()=>{const[boarded,setBoarded]=useState(()=>localStorage.getItem("zd_boarded")==="1");const[tab,setTab]=useState("home");const[records,setRecords]=useState(INIT_RECORDS);const[goals,setGoals]=useState(INIT_GOALS);const[showWizard,setShowWizard]=useState(false);

if(!boarded)return <Onboarding onDone={handleBoard}/>;

return <div>
{tab==="home"&&<HomePage records={records} goals={goals} setTab={setTab} onOpenWizard={()=>setShowWizard(true)}/>}
